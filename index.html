<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bayi Defteri">
<meta name="theme-color" content="#0f3d5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bayi Defteri</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#15212b; --muted:#66727d; --line:#e1e6ea;
  --brand:#0f3d5e; --brand2:#e8f0f6; --ok:#1b7a43; --okbg:#e6f4ec; --bad:#b3261e; --badbg:#fbe9e7; --warn:#8a5a00; --warnbg:#fff4dc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e141a; --card:#17212a; --ink:#e7edf2; --muted:#93a1ad; --line:#2a3743;
    --brand:#7fb6dd; --brand2:#1d2c38; --ok:#6fd39a; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1c1a; --warn:#f2c46b; --warnbg:#3a2f15; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.sp{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.big{font-size:20px;font-weight:700}
h2{font-size:17px;margin:14px 0 8px}
h3{font-size:15px;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{min-height:70px}
button.b{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--brand);color:#fff;width:100%;margin-top:10px}
@media (prefers-color-scheme: dark){button.b{color:#0e141a}}
button.b2{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;background:var(--card);color:var(--ink)}
button.b2.red{color:var(--bad)}
button.mini{white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;background:var(--card);color:var(--brand);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;padding:9px 4px;background:var(--card);color:var(--ink);font-size:14px}
.seg button.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{color:#0e141a}}
.kdv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.kdv div{background:var(--brand2);border-radius:8px;padding:6px 8px}
.kdv b{display:block;font-size:14px;white-space:nowrap;letter-spacing:-.2px}
.kdv span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:2px 8px;background:var(--brand2);color:var(--brand);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.list .it{padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.tap{cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat .card{margin:0}
.res{background:var(--okbg);border-radius:10px;padding:10px;margin-top:10px}
.res.neg{background:var(--badbg)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:#15212b;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:4px;border-bottom:1px solid var(--line)}
.hide{display:none}
.row>.sag{flex:0 0 auto;max-width:48%;text-align:right}
html,body{overflow-x:hidden}
</style>
<style>
.kdv.iki{grid-template-columns:1fr 1fr}
.kdv div.prim{background:var(--okbg)}
.satir{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.satir.kapali{opacity:.45}
.row.sp>b:last-child,.row.sp>span:last-child.big{text-align:right}
.yuk{display:flex;align-items:center;gap:10px;padding:14px;background:var(--brand2);border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<header><h1 id="title">Fiyat Ver</h1></header>
<main id="main"></main>
<nav id="nav">
  <button data-t="fiyat"><span class="i">₺</span>Fiyat Ver</button>
  <button data-t="stok"><span class="i">▦</span>Stok</button>
  <button data-t="giris"><span class="i">＋</span>Giriş</button>
  <button data-t="kar"><span class="i">↗</span>Kâr</button>
  <button data-t="diger"><span class="i">⋯</span>Diğer</button>
</nav>
<div id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
"use strict";
/* Bütün tutarlar KDV dahildir. Kâr = satış − maliyet − komisyon − ek gider (hepsi KDV dahil).
   Yıl sonu primi: alış fiyatı × prim %; "primli maliyet" = maliyet − prim. */
const KEY = "bayiDefteri.v1";
const BOS = () => ({ v:2, products:[], units:[], settings:{ marj:15, prim:0, kom:{ nakit:0, havale:0, kart:2.5, taksit:6 }, taksit:{ 2:3, 3:4.5, 6:8, 9:11, 12:14.5 }, taksitOrnek:true, banka:"elle", firma:"Nezih Poyraz", apiKey:"" } });
let db;
function load(){
  try { db = JSON.parse(localStorage.getItem(KEY)) || BOS(); } catch(e){ db = BOS(); }
  normalize();
}
function normalize(){
  const d = BOS(); db.settings = Object.assign(d.settings, db.settings||{}); db.settings.kom = Object.assign(d.settings.kom, db.settings.kom||{}); db.settings.taksit = Object.assign(d.settings.taksit, db.settings.taksit||{});
  db.products ||= []; db.units ||= []; db.listeler ||= []; db.katalog ||= {}; db.kampanyalar ||= [];
  /* 30.10: stok dökümünden "Küçük ev aleti" diye girilmiş buzdolabı vb. kategorileri düzelt */
  db.products.forEach(p=>{ if (p.kategori==="Küçük ev aleti") { const k = db.katalog[normModel(p.model)]?.kategori || listeKategori(p.ad||""); if (k && k!=="Küçük ev aleti") p.kategori = k; } });
  if ((db.v||1) < 2) { // v1: KDV hariç tutuluyordu → KDV dahile çevir
    db.units.forEach(u=>{ const o=1+(u.kdv??20)/100;
      if (u.alisHaric!=null){ u.alis=r2(u.alisHaric*o); u.ekMaliyet=r2((u.ekMaliyet||0)*o); delete u.alisHaric; }
      if (u.satis && u.satis.dahil!=null){ const s=u.satis; u.satis={ tarih:s.tarih, tutar:s.dahil, odeme:s.odeme, komOran:s.komOran, kom:s.kom, gider:r2(s.gider*o), musteri:s.musteri, not:s.not }; }
      delete u.kdv; });
    delete db.settings.kdv; db.v = 2;
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert("Kaydedilemedi: telefonda yer kalmamış olabilir. Diğer → Yedek al."); }
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const P = id => db.products.find(p=>p.id===id);
const r2 = n => Math.round((+n||0)*100)/100;
const TL = n => (+n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";
const virgul = n => n ? String(n).replace(".",",") : "";
const today = () => new Date().toISOString().slice(0,10);
const trDate = s => s ? s.split("-").reverse().join(".") : "";
const gun = s => Math.max(0, Math.floor((Date.now()-new Date(s).getTime())/864e5));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(v){
  if (typeof v === "number") return v;
  let s = String(v??"").replace(/[₺\s]|TL/gi,"");
  if (!s) return 0;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if (s.includes(",")) s = s.replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
/* Maliyet ve prim */
const maliyet = u => r2(u.alis + (u.ekMaliyet||0));
const primOran = u => { const p = P(u.pid); return p && p.prim != null && p.prim !== "" ? num(p.prim) : num(db.settings.prim); };
const primTutar = u => r2(u.alis * primOran(u)/100);
const primliMaliyet = u => r2(maliyet(u) - primTutar(u));
const maliyetKutu = u => `<div class="kdv iki"><div><span>Maliyet (prim düşmeden)</span><b>${TL(maliyet(u))}</b></div><div class="prim"><span>Prim düştükten sonra · %${primOran(u)}</span><b>${TL(primliMaliyet(u))}</b></div></div>`;
function satisHesap(u, s){
  const tutar = r2(num(s.tutar)), kom = r2(tutar * num(s.komOran)/100), gider = r2(num(s.gider)), kampPrim = r2(num(s.kampPrim)), fark = r2(num(s.fark)), aile = r2(num(s.aile));
  const kar = r2(tutar - maliyet(u) - kom - gider + kampPrim + fark + aile), prim = primTutar(u);
  return { tutar, kom, gider, kampPrim, fark, aile, maliyet:maliyet(u), kar, prim, karPrimli:r2(kar+prim), oran: maliyet(u) ? kar/maliyet(u)*100 : 0 };
}
/* Hedef kâr %'si (maliyet üstüne) için satış fiyatı; komisyon satış tutarından kesilir */
const fiyatIcin = (c, marj, komOran) => r2(c*(1+num(marj)/100) / (1 - num(komOran)/100));
/* Profilo aylık toptan fiyat listesi: listeler[0] en güncel; k[MODEL] = { n: nakit, v: vadeli } */
const guncelListe = () => db.listeler[0];
const listeFiyat = (model, i=0) => { const l = db.listeler[i]; return l && l.k[normModel(model)]; };
function listeKutu(model, mal){
  const l = guncelListe(), f = listeFiyat(model); if (!f) return "";
  const once = listeFiyat(model, 1), deg = once && once.n ? (f.n-once.n)/once.n*100 : null, fark = mal!=null ? r2(f.n - mal) : null;
  return `<div class="res" style="background:var(--brand2)"><div class="muted">Profilo’dan şu an alsa · ${esc(l.ad)}</div>
    <div class="row sp"><span>Nakit</span><b>${TL(f.n)}</b></div>${f.v?`<div class="row sp"><span>Vadeli (opsiyonlu)</span><b>${TL(f.v)}</b></div>`:""}
    ${fark!=null?`<div class="row sp"><span>Senin maliyetine göre</span><b class="${fark>=0?"pos":"neg"}">${fark>=0?"+":""}${TL(fark)}</b></div>`:""}
    ${deg!=null&&Math.abs(deg)>=0.05?`<div class="muted">Geçen listeye göre ${deg>0?"+":""}%${deg.toFixed(1)} (${TL(once.n)} → ${TL(f.n)})</div>`:""}</div>`;
}
const stoktaki = pid => db.units.filter(u=>u.pid===pid && !u.satis);
/* Seri numarası olmayan, aynı fiyat/tarih/belgeyle girilmiş stok cihazlarını tek kartta topla */
function gruplar(us){ const g = [], m = {};
  us.forEach(u=>{ if (u.seri || u.satis) return g.push([u]); const k = [u.pid,u.alis,u.ekMaliyet||0,u.gTarih,u.fatura||"",u.tedarikci||""].join("|"); if (!m[k]) g.push(m[k]=[]); m[k].push(u); });
  return g; }
const grupBaslik = g => g[0].seri ? `Seri: ${esc(g[0].seri)}` : `${g.length} adet · seri no yok`;
const maliyetYok = u => !u.alis ? `<div class="res neg"><b>Alış fiyatı girilmemiş.</b> <span class="muted">Ürün ekranından “Stoğun alış fiyatını değiştir” ile girin.</span></div>` : "";
const pAd = p => p ? [p.marka, p.model].filter(Boolean).join(" ") + (p.ad ? " · "+(p.ad.length>40 ? p.ad.slice(0,38).trim()+"…" : p.ad) : "") : "(silinmiş ürün)";
const normModel = s => String(s||"").toLocaleUpperCase("tr").replace(/\s+/g,"");
function ara(q, sadeceStok){
  q = (q||"").toLocaleLowerCase("tr").trim();
  return db.products.filter(p=>{
    if (sadeceStok && !stoktaki(p.id).length) return false;
    if (!q) return true;
    const hay = [p.marka,p.kategori,p.model,p.ad,p.barkod].join(" ").toLocaleLowerCase("tr");
    if (q.split(/\s+/).every(w=>hay.includes(w))) return true;
    return db.units.some(u=>u.pid===p.id && (u.seri||"").toLocaleLowerCase("tr").includes(q));
  });
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }

/* ---------- Ekranlar ---------- */
const $ = s => document.querySelector(s);
const main = $("#main");
let tab = "fiyat", durum = { q:"", pid:null, marj:null, odeme:"kart" };
const BASLIK = { fiyat:"Fiyat Ver", stok:"Stok", giris:"Ürün Girişi", kar:"Kâr", diger:"Diğer" };
function go(t){ tab=t; $("#title").textContent=BASLIK[t]; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); render(); window.scrollTo(0,0); }
function render(){ ({fiyat:vFiyat, stok:vStok, giris:vGiris, kar:vKar, diger:vDiger})[tab](); }
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
const aramaKutusu = ph => `<input id="q" type="search" placeholder="${ph}" value="${esc(durum.q)}" autocomplete="off">`;
function aramaBagla(cb){ const q=$("#q"); q.oninput=()=>{ durum.q=q.value; cb(); }; }
const ODEME = { nakit:"Nakit", havale:"Havale/EFT", kart:"Kart tek çekim", taksit:"Kart taksit" };
const odemeOps = sec => Object.entries(ODEME).map(([k,v])=>`<option value="${k}"${k===sec?" selected":""}>${v}</option>`).join("");

/* Fiyat Ver */
function vFiyat(){
  const s = db.settings;
  if (durum.marj==null) durum.marj = s.marj;
  main.innerHTML = `${aramaKutusu("Model, marka, seri no ara…")}<div id="sonuc"></div>`;
  aramaBagla(sonuc); sonuc();
  function sonuc(){
    const el = $("#sonuc");
    if (durum.pid && P(durum.pid)) return detay(P(durum.pid));
    const l = ara(durum.q, true);
    if (!db.products.length) { el.innerHTML = `<div class="empty">Henüz ürün yok.<br>“Giriş”ten faturayı okutun ya da Diğer → Listeden yükle.</div>`; return; }
    el.innerHTML = l.length ? `<div class="card list">${l.slice(0,60).map(p=>{
      const st = stoktaki(p.id), ms = st.map(maliyet), mn = Math.min(...ms), mx = Math.max(...ms);
      return `<div class="it tap" data-p="${p.id}"><div class="row sp"><div><h3>${esc(pAd(p))}</h3><div class="muted">${esc(p.kategori||"")}</div></div><div class="sag"><span class="pill">${st.length} adet</span>${degisimRozet(p.model)}<div class="muted">maliyet ${TL(mn)}${mx!==mn?" – "+TL(mx):""}</div></div></div></div>`;
    }).join("")}</div>` : `<div class="empty">Stokta eşleşen ürün yok.</div>`;
    const q = (durum.q||"").toLocaleLowerCase("tr").trim(), gor = new Set(l.map(p=>normModel(p.model)));
    const kat = q.length>=2 && guncelListe() ? Object.entries(guncelListe().k).filter(([m])=>!gor.has(m) && (m.toLocaleLowerCase("tr").includes(q.replace(/\s+/g,"")) || (db.katalog[m]?.ad||"").toLocaleLowerCase("tr").includes(q))).slice(0,20) : [];
    if (kat.length) el.innerHTML += `<h2>Profilo fiyat listesinde</h2><div class="card list">${kat.map(([m,f])=>`<div class="it tap" data-m="${esc(m)}"><div class="row sp"><div><h3>${esc(db.katalog[m]?.model||m)}</h3><div class="muted">${esc((db.katalog[m]?.ad||"").slice(0,70))}</div></div><div class="sag"><b>${TL(f.n)}</b><div class="muted">nakit</div></div></div></div>`).join("")}</div>`;
    el.querySelectorAll("[data-p]").forEach(d=>d.onclick=()=>{ durum.pid=d.dataset.p; sonuc(); });
    el.querySelectorAll("[data-m]").forEach(d=>d.onclick=()=>katalogDetay(d.dataset.m));
  }
  function detay(p){
    const el = $("#sonuc"), st = stoktaki(p.id).sort((a,b)=>a.gTarih.localeCompare(b.gTarih));
    const kom = s.kom[durum.odeme]||0;
    el.innerHTML = `
      <div class="card"><div class="row sp"><div><h3>${esc(pAd(p))}</h3><div class="muted">${esc(p.kategori||"")}${p.liste?` · liste fiyatı ${TL(p.liste)}`:""}</div></div><button class="mini" id="geri" style="flex:0 0 auto">Geri</button></div></div>
      <div class="card">
        <div class="row"><div><label>Hedef kâr % (maliyet üstüne)</label><input id="marj" inputmode="decimal" value="${durum.marj}"></div>
        <div><label>Ödeme</label><select id="od">${odemeOps(durum.odeme)}</select></div></div>
        <div class="muted" style="margin-top:6px">Komisyon %${kom} · tüm tutarlar KDV dahil</div>
        ${listeKutu(p.model)}
        ${listeFiyat(p.model)?`<div class="muted" style="margin-top:6px">Güncel liste fiyatına göre önerilen satış: <b>${TL(fiyatIcin(listeFiyat(p.model).n, durum.marj, kom))}</b></div>`:""}
      </div>
      ${st.length ? kampanyaKutu(st[0]) : ""}
      ${st.length ? `<div class="card"><h3>Taksit seçenekleri ve teklif</h3><div id="taksitAlan"></div></div>` : ""}
      ${st.length ? gruplar(st).map(g=>{ const u = g[0];
        const o = fiyatIcin(maliyet(u), durum.marj, kom), z = fiyatIcin(maliyet(u), 0, kom), zp = fiyatIcin(primliMaliyet(u), 0, kom);
        return `<div class="card">
          <div class="row sp"><div><b>${grupBaslik(g)}</b><div class="muted">Giriş ${trDate(u.gTarih)} · ${gun(u.gTarih)} gündür stokta</div></div>${gun(u.gTarih)>90?'<span class="pill warn" style="flex:0 0 auto">bekleyen</span>':""}</div>
          ${maliyetKutu(u)}${maliyetYok(u)}
          ${u.ekMaliyet?`<div class="muted">Alış ${TL(u.alis)} + ek maliyet ${TL(u.ekMaliyet)}</div>`:""}
          ${listeFiyat(p.model)&&u.alis?`<div class="muted">Şu an alsa nakit ${TL(listeFiyat(p.model).n)} · senin alışın ${TL(u.alis)} (${Math.abs(listeFiyat(p.model).n-u.alis)<1?"liste fiyatıyla aynı":(listeFiyat(p.model).n>u.alis?"ucuza almışsın ":"pahalıya almışsın ")+TL(Math.abs(listeFiyat(p.model).n-u.alis))})</div>`:""}
          <div class="res"><div class="muted">Önerilen satış fiyatı (%${durum.marj} kâr, prim hariç)</div><div class="big">${TL(o)}</div></div>
          ${farkKutu(p, u, kom)}
          <div class="res neg"><div class="row sp"><span class="muted">Zarar sınırı · primsiz</span><b>${TL(z)}</b></div><div class="row sp"><span class="muted">Zarar sınırı · prim düşünce</span><b>${TL(zp)}</b></div></div>
          <button class="b" data-sat="${u.id}" data-f="${o}">${g.length>1?"Bunlardan 1 adet sat":"Bu cihazı sat"}</button>
        </div>`;}).join("") : `<div class="empty">Bu üründen stokta cihaz kalmamış.</div>`}`;
    $("#geri").onclick=()=>{ durum.pid=null; vFiyat(); };
    $("#marj").onchange=e=>{ durum.marj=num(e.target.value); detay(p); };
    $("#od").onchange=e=>{ durum.odeme=e.target.value; detay(p); };
    el.querySelectorAll("[data-sat]").forEach(b=>b.onclick=()=>satisFormu(b.dataset.sat, +b.dataset.f));
    el.querySelectorAll("[data-kmp]").forEach(b=>b.onclick=()=>kampanyaSatis(b.dataset.kmp, b.dataset.u));
    if (st.length) taksitCiz($("#taksitAlan"), p, fiyatIcin(maliyet(st[0]), durum.marj, s.kom.nakit||0));
  }
}

/* Stok */

      ${lis.length?`<div class="row sp" style="margin-top:8px"><span class="muted">${lis.length} cihaz bugün alınsa (${esc(guncelListe().ad)}, nakit)</span><b>${TL(lisT)}</b></div><div class="row sp"><span class="muted">Senin alışına göre fark</span><b class="${lisT>=lisM?"pos":"neg"}">${lisT>=lisM?"+":""}${TL(lisT-lisM)}</b></div>`:""}</div>`;
    if ($("#ekUyari")) $("#ekUyari").onclick=()=>{ durum.filt="eksik"; vStok(); };

    $("#liste").querySelectorAll("[data-p]").forEach(d=>d.onclick=()=>urunDetay(d.dataset.p));

  function eksikListe(){

      <div class="card list">${l.map(p=>{ const n = stoktaki(p.id).filter(u=>!u.alis).length;
        return `<div class="it" data-p="${p.id}"><div class="row sp"><div><h3 class="tap" data-ac="${p.id}">${esc(pAd(p))}</h3><div class="muted">${esc(p.kategori||"")} · ${n} cihaz</div></div></div>

      <button class="b" id="eksikHepsi">Yazılanların hepsini kaydet</button>`;

const eksikler = () => { const s = new Set(db.units.filter(u=>!u.satis && !u.alis).map(u=>u.pid)); return db.products.filter(p=>s.has(p.id)); };
function urunDetay(pid){

      <div class="muted">Giriş ${trDate(u.gTarih)}${u.tedarikci?" · "+esc(u.tedarikci):""}${u.fatura?" · fatura "+esc(u.fatura):""}</div>
      ${maliyetKutu(u)}${u.satis?"":maliyetYok(u)}
      ${u.satis?`<div class="res ${h.kar<0?"neg":""}"><div class="row sp"><span>Satış ${trDate(u.satis.tarih)} · ${ODEME[u.satis.odeme]||""}</span><b>${TL(u.satis.tutar)}</b></div><div class="row sp"><span>Kâr</span><b class="${h.kar<0?"neg":"pos"}">${TL(h.kar)}</b></div><div class="row sp"><span>Prim düşünce kâr</span><b>${TL(h.karPrimli)}</b></div>${u.satis.kampanya?`<div class="muted">Kampanya: ${esc(u.satis.kampanya.ad)} · prim payı ${TL(u.satis.kampanya.prim)}</div>`:""}${u.satis.fark?`<div class="muted">Profilo fiyat farkı ${TL(u.satis.fark)}</div>`:""}${u.satis.aile?`<div class="muted">Aile Bakanlığı farkı ${TL(u.satis.aile)}</div>`:""}${u.satis.taksit?`<div class="muted">${esc(u.satis.taksit.banka)} · ${u.satis.taksit.n} taksit</div>`:""}${u.satis.musteri?`<div class="muted">${esc(u.satis.musteri)}</div>`:""}</div>`:""}
      <div class="row" style="margin-top:8px">${u.satis?`<button class="b2" data-geri="${u.id}">Satışı geri al</button>`:`<button class="b2" data-sat="${u.id}">Sat</button><button class="b2" data-ud="${u.id}">Düzenle</button>`}<button class="b2 red" data-sil="${u.id}">${g.length>1?"1 adet sil":"Sil"}</button></div></div>`; }).join("")}
    <button class="b2 red" id="usil" style="width:100%;margin-top:10px">Ürünü tamamen sil</button>`);
  $("#kapat").onclick=sheetKapat;
  $("#duz").onclick=()=>urunFormu(p);
  if ($("#topFiyat")) $("#topFiyat").onclick=()=>{ const lf = listeFiyat(p.model), v = prompt(`Stoktaki ${stoktaki(pid).length} cihazın birim alış fiyatı (KDV dahil):`, virgul(lf?lf.n:stoktaki(pid)[0].alis)); if (v==null) return;
    const n = r2(num(v)); if (!n) return alert("Geçerli bir fiyat yazın."); stoktaki(pid).forEach(u=>u.alis=n); save(); urunDetay(pid); render(); };
  $("#ekle").onclick=()=>{ sheetKapat(); durum.girisPid=pid; go("giris"); };
  $("#usil").onclick=()=>{ if(!confirm("Ürün ve tüm cihaz kayıtları silinsin mi? (satış geçmişi dahil)")) return; db.units=db.units.filter(u=>u.pid!==pid); db.products=db.products.filter(x=>x.id!==pid); save(); sheetKapat(); render(); };
  document.querySelectorAll("#sheet [data-sat]").forEach(b=>b.onclick=()=>{ const u=db.units.find(x=>x.id===b.dataset.sat); satisFormu(u.id, p.liste||fiyatIcin(maliyet(u),db.settings.marj,db.settings.kom[durum.odeme]||0)); });
  document.querySelectorAll("#sheet [data-geri]").forEach(b=>b.onclick=()=>{ if(!confirm("Satış silinip cihaz stoğa geri alınsın mı?")) return; db.units.find(x=>x.id===b.dataset.geri).satis=null; save(); urunDetay(pid); render(); });
  document.querySelectorAll("#sheet [data-sil]").forEach(b=>b.onclick=()=>{ if(!confirm("Bu cihaz kaydı silinsin mi?")) return; db.units=db.units.filter(x=>x.id!==b.dataset.sil); save(); urunDetay(pid); render(); });
  document.querySelectorAll("#sheet [data-ud]").forEach(b=>b.onclick=()=>cihazFormu(db.units.find(x=>x.id===b.dataset.ud)));

const KATEGORI = ["Buzdolabı","Çamaşır makinesi","Bulaşık makinesi","Kurutma makinesi","Derin dondurucu","Fırın","Ocak","Davlumbaz","Ankastre set","Mikrodalga fırın","Klima","Televizyon","Süpürge","Su sebili","Küçük ev aleti"];

function urunBulAc(v){
  const kt = db.katalog[normModel(v.model)]; if (kt) v = { ...v, kategori: v.kategori || kt.kategori, ad: v.ad || kt.ad };
  let p = db.products.find(x=>normModel(x.model)===normModel(v.model));
  if (!p) { p = { id:uid(), marka:v.marka||"Profilo", kategori:v.kategori||"", model:v.model.trim(), ad:v.ad||"", barkod:v.barkod||"", liste:v.liste||null, prim:v.prim??null }; db.products.push(p); }
  else { for (const a of ["kategori","ad","barkod"]) if (!p[a] && v[a]) p[a]=v[a]; }
  return p;
}
function cihazEkle(p, n, seriler, ortak){
  for (let i=0;i<n;i++) db.units.push({ id:uid(), pid:p.id, seri:seriler[i]||"", gTarih:ortak.gTarih||today(), alis:r2(ortak.alis), ekMaliyet:r2(ortak.ekMaliyet||0), fatura:ortak.fatura||"", tedarikci:ortak.tedarikci||"", satis:null });
}

/* ---------- Fatura okuma (Claude) ---------- */
const FATURA_SEMA = { type:"object", additionalProperties:false, required:["fatura_no","tarih","tedarikci","kalemler","not"], properties:{
  fatura_no:{type:"string"}, tarih:{type:"string", description:"YYYY-AA-GG, okunamazsa boş"}, tedarikci:{type:"string"}, not:{type:"string"},
  kalemler:{ type:"array", items:{ type:"object", additionalProperties:false, required:["model","aciklama","marka","kategori","adet","birim_fiyat_kdv_dahil","seri_nolar"], properties:{
    model:{type:"string"}, aciklama:{type:"string"}, marka:{type:"string"}, kategori:{type:"string"}, adet:{type:"integer"},
    birim_fiyat_kdv_dahil:{type:"number"}, seri_nolar:{type:"array", items:{type:"string"}} } } } } };
const FATURA_ISTEM = `Bu bir beyaz eşya bayisinin alış faturası (çoğunlukla Profilo/BSH). Faturadaki her ürün kalemini çıkar.
- model: ürün/stok kodu (ör. CMG140DTR). Yoksa açıklamadaki model kodunu kullan.
- aciklama: ürün adı. marka: faturada yazan marka, yoksa "Profilo". kategori: şunlardan biri: ${KATEGORI.join(", ")}.
- birim_fiyat_kdv_dahil: bir adedin iskontolar düşülmüş, KDV eklenmiş net fiyatı = (satırın KDV hariç net tutarı + o satırın KDV'si) / adet. Kuruşa yuvarla.
- seri_nolar: faturada seri numarası yazıyorsa o kalemin seri numaraları; yoksa boş liste.
- Nakliye, hizmet gibi ürün olmayan satırları kalemlere koyma; varsa "not" alanında tutarıyla belirt.
- Okuyamadığın ya da emin olmadığın şeyleri "not" alanına yaz. Uydurma.`;
async function dosyaVeri(f){
  if (f.type === "application/pdf") return { tip:"document", media:"application/pdf", data: await b64(f) };
  const img = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(f); });
  const k = Math.min(1, 2000/Math.max(img.width,img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return { tip:"image", media:"image/jpeg", data: c.toDataURL("image/jpeg",0.85).split(",")[1] };
}
const b64 = f => new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.readAsDataURL(f); });
let SDK;
async function claudeFatura(v){
  SDK ||= (await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm")).default;
  const client = new SDK({ apiKey: db.settings.apiKey, dangerouslyAllowBrowser: true });
  const resp = await client.beta.messages.create({
    model: "claude-opus-5-5", max_tokens: 16000,
    betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
    output_config: { effort: "medium", format: { type: "json_schema", schema: FATURA_SEMA } },
    messages: [{ role:"user", content:[ { type:v.tip, source:{ type:"base64", media_type:v.media, data:v.data } }, { type:"text", text:FATURA_ISTEM } ] }]
  });
  if (resp.stop_reason === "refusal") throw new Error("Fatura okunamadı (istek reddedildi).");
  if (resp.stop_reason === "max_tokens") throw new Error("Fatura çok uzun, yarım kaldı. Sayfa sayfa okutun.");
  const t = resp.content.find(b=>b.type==="text"); if (!t) throw new Error("Cevap boş geldi.");
  return JSON.parse(t.text);
}
async function faturaOku(f){
  if (f.type==="application/pdf" || /\.pdf$/i.test(f.name)) {
    sheet(`<h2>Fatura okunuyor…</h2><div class="yuk"><span class="big">⏳</span><span>e-Fatura PDF’i okunuyor.</span></div>`);
    try { const r = efaturaCoz(await pdfSatirlar(f)); if (r && r.kalemler.length) return faturaOnay(r); } catch(e){ console.warn("PDF okunamadı", e); }
    if (!db.settings.apiKey) { sheet(`<h2>Fatura tanınmadı</h2><div class="res neg">Bu PDF’in düzeni tanınmadı (taranmış ya da farklı şablon olabilir).</div><div class="muted" style="margin-top:8px">Elle giriş yapın ya da Ayarlar’a Claude API anahtarı girin.</div><button class="b" id="kapat">Tamam</button>`); $("#kapat").onclick=sheetKapat; return; }
  } else if (!db.settings.apiKey) { alert("Fotoğraftan okuma için Diğer → Ayarlar’a Claude API anahtarı girin. e-Fatura PDF’ini seçerseniz anahtar gerekmez."); return go("diger"); }
  sheet(`<h2>Fatura okunuyor…</h2><div class="yuk"><span class="big">⏳</span><span>Kalemler çıkarılıyor, 20–60 saniye sürebilir.</span></div>`);
  let r;
  try { r = await claudeFatura(await dosyaVeri(f)); }
  catch(e){ const m = e && e.status===401 ? "API anahtarı geçersiz." : e && e.status===429 ? "Çok sık istek; biraz sonra tekrar deneyin." : (e && e.message) || String(e);
    sheet(`<h2>Fatura okunamadı</h2><div class="res neg">${esc(m)}</div><div class="muted" style="margin-top:8px">İnternet bağlantısını kontrol edin ya da elle giriş yapın.</div><button class="b" id="kapat">Tamam</button>`); $("#kapat").onclick=sheetKapat; return; }
  faturaOnay(r);
}

        <label>Seri numaraları (her satıra bir)</label><textarea data-k="seri" style="min-height:44px">${esc((x.seri_nolar||[]).join("\n"))}</textarea>
      </div>`; }).join("")}
      <datalist id="kategoriler">${KATEGORI.map(m=>`<option value="${esc(m)}">`).join("")}</datalist>
      <div id="ftTop"></div>

    document.querySelectorAll(".satir").forEach(d=>{ const x=k[d.dataset.i];

/* Profilo toptan fiyat listesi: her sayfada "Ürün" başlık satırı, B sütunu model, "fiyat" geçen ilk iki sütun nakit/vadeli */
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function listeKategori(s){ s = s.toLocaleUpperCase("tr");
  const t = [[/TELEVİZYON|\bTV\b|QLED|OLED/,"Televizyon"],[/ISI POMPALI/,"Kurutma makinesi"],[/KULAKLIK/,"Küçük ev aleti"],[/MİKRODALGA/,"Mikrodalga fırın"],[/BUZDOLA[BP]/,"Buzdolabı"],[/DERİN DONDURUCU/,"Derin dondurucu"],[/ÇAMAŞIR/,"Çamaşır makinesi"],[/KURUTMA/,"Kurutma makinesi"],[/BULAŞIK/,"Bulaşık makinesi"],[/FIRIN/,"Fırın"],[/OCAK/,"Ocak"],[/DAVLUMBAZ|ASPİRATÖR/,"Davlumbaz"],[/KLİMA|ÜNİTE|BTU/,"Klima"],[/SÜPÜRGE|TORBA/,"Süpürge"],[/SET/,"Ankastre set"],[/SEBİL/,"Su sebili"]];
  for (const [r,k] of t) if (r.test(s)) return k; return "Küçük ev aleti"; }
function profiloListesiCoz(wb){
  const sayfalar = [], k = {}, kat = {}; let tarih = "", kdvDahil = true;
  wb.SheetNames.forEach(ad=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[ad],{header:1,raw:true,defval:""}); let pc=null, ana="", alt="", n=0, cift=0;
    rows.forEach(r=>{
      const b = String(r[1]??"").trim(), c = String(r[2]??"").trim();
      const t = r.map(x=>String(x)).join(" "), m = t.match(/(\d{2})\.(\d{2})\.(\d{4}) TARİHİNDEN/i); if (m && !tarih) tarih = `${m[3]}-${m[2]}-${m[1]}`;
      if (/kdv dahil değil|kdv hariç/.test(trk(t))) kdvDahil = false;
      const fiy = r.map((x,i)=>i>1 && String(x).toLocaleLowerCase("tr").includes("fiyat") ? i : -1).filter(i=>i>=0);
      if (/^ürün( kodu)?$/i.test(b.toLocaleLowerCase("tr")) && fiy.length) { pc = fiy.slice(0,2); return; }
      if (!pc || !b) return;
      const nak = r[pc[0]];
      if (typeof nak === "number" && nak > 0 && !/valör|valor|fiyat listesi/i.test(b)) {
        const key = normModel(b); n++;
        if (k[key]) { cift++; if (!kat[key].ad && c) Object.assign(kat[key], { ad:c.replace(/\s*\n\s*/g," · ").slice(0,160), kategori:listeKategori(ana+" "+alt+" "+b) }); return; }
        k[key] = { n:r2(nak), v: typeof r[pc[1]]==="number" ? r2(r[pc[1]]) : null };
        kat[key] = { model:b, ad:c.replace(/\s*\n\s*/g," · ").slice(0,160), kategori: /klima/i.test(ad) ? "Klima" : listeKategori(ana+" "+alt+" "+b), sayfa:ad, grup:(ana+" "+alt).trim() };
      } else if (/GENEL ÜRÜN AÇIKLAMASI/i.test(c) && b !== b.toLocaleUpperCase("tr")) alt = b;
      else if (b === b.toLocaleUpperCase("tr") && !/\d/.test(b) && !/FİYAT|VALÖR|ÜRÜN/.test(b)) { ana = b; alt = ""; }
    });
    if (n) sayfalar.push({ ad, n, cift });
  });
  return { k, kat, tarih, kdvDahil, sayfalar };
}

function indir(blob, ad){
  const f = new File([blob], ad, {type:blob.type});
  if (navigator.canShare && navigator.canShare({files:[f]})) { navigator.share({files:[f], title:ad}).catch(()=>{}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ad; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

const ALANLAR = [
  ["model","Model kodu *"],["marka","Marka"],["kategori","Kategori"],["ad","Ürün adı"],["barkod","Barkod"],
  ["liste","Liste fiyatı"],["alis","Alış fiyatı"],["prim","Yıl sonu primi %"],["adet","Stok adedi"],["seri","Seri no"],["tarih","Giriş tarihi"],["fatura","Fatura no"],["tedarikci","Tedarikçi"]
];
const TAHMIN = { model:/model|ürün kodu|urun kodu|stok kodu|kod/i, marka:/marka/i, kategori:/kategori|grup|cins/i, ad:/ad[ıi]|açıklama|aciklama|tanım|ürün$/i, barkod:/barkod|ean/i,
  liste:/liste|satış fiyat|satis fiyat|psf|etiket/i, alis:/alış|alis|maliyet|bayi fiyat|net fiyat/i, prim:/prim/i, adet:/adet|miktar|stok$|stok adedi/i, seri:/seri/i, tarih:/tarih/i, fatura:/fatura/i, tedarikci:/tedarik|firma|cari/i };
async function tabloOku(f){
  let rows;
  try {
    if (/\.csv$/i.test(f.name)) { const t=await f.text(), ilk=t.split("\n")[0], ay=(ilk.match(/;/g)||[]).length>(ilk.match(/,/g)||[]).length?";":",";
      rows = t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const out=[]; let c="",q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===ay&&!q){out.push(c);c="";} else c+=ch; } out.push(c); return out.map(x=>x.trim()); }); }
    else { if(!window.XLSX) { alert("Excel modülü yüklenemedi. İnternete bağlıyken tekrar deneyin ya da CSV kullanın."); return null; }
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""}); }
  } catch(e){ alert("Dosya okunamadı: "+e.message); return null; }
  rows = rows.filter(r=>r.some(c=>String(c).trim()));
  if (rows.length<2) { alert("Dosyada satır bulunamadı."); return null; }
  let bas = rows.findIndex(r=>r.filter(c=>typeof c==="string"&&c.trim()).length>=2); if (bas<0) bas=0;
  return { baslik: rows[bas].map((c,i)=>String(c).trim()||`Sütun ${i+1}`), veri: rows.slice(bas+1) };
}
const trk = s => String(s??"").toLocaleLowerCase("tr"); // Türkçe İ/ı ile güvenli küçük harf
const yerelTarih = d => { d = new Date(d.getTime() + 12*3600e3); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }; // Excel tarihi saat dilimiyle kaymasın
const tarihOku = t => t instanceof Date ? yerelTarih(t) : (/^\d{1,2}[./]\d{1,2}[./]\d{4}/.test(String(t).trim()) ? String(t).trim().slice(0,10).split(/[./]/).reverse().map(x=>x.padStart(2,"0")).join("-") : (/^\d{4}-\d{2}-\d{2}/.test(String(t)) ? String(t).slice(0,10) : ""));

/* Diva satış raporu içe aktarma */
const S_ALANLAR = [["model","Model / stok kodu *"],["seri","Seri no"],["tutar","Satış tutarı (satır toplamı)"],["adet","Adet"],["tarih","Tarih"],["belge","Fiş / fatura no"],["odeme","Ödeme şekli"],["musteri","Müşteri"]];
const S_TAHMIN = { model:/model|stok kodu|ürün kodu|urun kodu|malzeme kodu|kod/i, seri:/seri/i, tutar:/tutar|toplam|net|fiyat/i, adet:/adet|miktar/i, tarih:/tarih/i, belge:/fiş|fis|fatura|belge|evrak/i, odeme:/ödeme|odeme|tahsilat/i, musteri:/müşteri|musteri|cari|unvan/i };
const odemeTahmin = s => { s=String(s||"").toLocaleLowerCase("tr"); return /taksit/.test(s)?"taksit":/kart|kredi|pos/.test(s)?"kart":/havale|eft|banka/.test(s)?"havale":"nakit"; };

      const tarih=tarihOku(g(r,"tarih"))||today(), belge=String(g(r,"belge")).trim();

    es_.forEach(x=>{ x.satis.komOran=db.settings.kom[x.satis.odeme]||0; x.satis.kom=r2(x.satis.tutar*x.satis.komOran/100);

/* ---------- Zam / indirim uyarısı: güncel liste ile bir önceki karşılaştırılır ---------- */
function degisimOran(model){ const y=listeFiyat(model), e=listeFiyat(model,1); return y && e && e.n ? (y.n-e.n)/e.n*100 : 0; }
const degisimRozet = model => { const o = degisimOran(model); return Math.abs(o)>=0.5 ? `<span class="pill ${o>0?"warn":"ok"}" style="margin-left:4px">${o>0?"▲":"▼"} %${Math.abs(o).toFixed(1)}</span>` : ""; };
function listeDegisim(){
  const [y,e] = db.listeler; if (!y || !e) return null;
  const art=[], dus=[], yeni=[], kalk=[];
  for (const m in y.k){ const o=e.k[m]; if (!o) yeni.push(m); else if (Math.abs(y.k[m].n-o.n)>=1) (y.k[m].n>o.n?art:dus).push({ m, eski:o.n, yeni:y.k[m].n, oran:(y.k[m].n-o.n)/o.n*100 }); }
  for (const m in e.k) if (!y.k[m]) kalk.push(m);
  const stokAdet = m => db.units.filter(u=>!u.satis && normModel(P(u.pid)?.model)===m).length;
  [art,dus].forEach(l=>l.forEach(x=>{ x.stok=stokAdet(x.m); x.etki=r2(x.stok*(x.yeni-x.eski)); }));
  return { y, e, art, dus, yeni, kalk:kalk.map(m=>({ m, stok:stokAdet(m) })) };
}
function degisimOzet(){

  sheet(`<div class="row sp"><h2 style="margin:0">Fiyat değişimleri</h2><button class="mini" id="kapat" style="flex:0 0 auto">Kapat</button></div>
    <div class="muted">${esc(d.e.ad)} → ${esc(d.y.ad)}</div>

    <div class="res ${etki<0?"neg":""}"><div class="row sp"><span>Stoktaki malın bugünkü değerine etkisi</span><b>${etki>=0?"+":""}${TL(etki)}</b></div><div class="muted">Zamlanan ürünlerde eldeki eski stok artık daha değerli: satış fiyatını yükseltmeyi düşünün.</div></div>
    ${sA.length?`<h2>Zamlanan, stokta olan (${sA.length})</h2><div class="card">${tablo(sA)}</div>`:""}
    ${sD.length?`<h2>İndirime giren, stokta olan (${sD.length})</h2><div class="card">${tablo(sD)}</div>`:""}
    ${sK.length?`<h2>Listeden kalkan ama stokta olan (${sK.length})</h2><div class="card"><div class="muted">Eski model olabilir; elden çıkarmayı düşünün.</div>${sK.map(x=>`<div class="row sp"><span>${ad(x.m)}</span><b>${x.stok} adet</b></div>`).join("")}</div>`:""}
    ${!sA.length&&!sD.length&&!sK.length?`<div class="empty">Stoktaki ürünlerde fiyat değişimi yok.</div>`:""}`);
  $("#kapat").onclick=sheetKapat;

/* ---------- e-Fatura PDF'ini yerelde okuma (metinli PDF; taranmış değil) ---------- */
async function pdfSatirlar(f){
  await scriptYukle(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS.replace("pdf.min.js","pdf.worker.min.js");
  const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise, sayfalar = [];
  for (let i=1;i<=doc.numPages;i++){ const tc = await (await doc.getPage(i)).getTextContent(); sayfalar.push(tc.items.filter(t=>t.str.trim()).map(t=>({ x:t.transform[4], y:t.transform[5], s:t.str.trim() }))); }
  return sayfalar;
}
const MARKALAR = ["Profilo","Bosch","Siemens","Grundig","Arçelik","Beko","Vestel","Samsung","LG","Regal","Altus","Electrolux","Indesit","Hotpoint","Miele","Philips","Sony","TCL","Toshiba","Hitachi","Simfer","Luxell","Fakir","Tefal","Arzum","Sinbo","Kumtel","Uğur","Neff","Gaggenau"];
/* "Grundig GPWM 91624 RS 9 kg Çamaşır Makinesi" → marka Grundig, model "GPWM 91624 RS" */
function adModel(ad){
  let tk = ad.split(/\s+/).filter(Boolean), marka = "";
  const m = MARKALAR.find(x=>x.toLocaleLowerCase("tr")===(tk[0]||"").toLocaleLowerCase("tr")); if (m) { marka = m; tk = tk.slice(1); }
  const mod = []; for (const t of tk){ if (/["”″]/.test(t) || /[a-zçğıöşü]/.test(t)) break; mod.push(t); }
  if (mod.length>1 && /^\d{1,2}$/.test(mod[mod.length-1])) mod.pop(); // "… RS 9 kg", "… E 5 Programlı"
  return { marka, model: mod.join(" ") };
}
const PARA = /^-?[\d.]+,\d{2,}(\s*TL)?$/i;
function efaturaCoz(sayfalar){
  const kucuk = s => s.replace(/\s+/g," ").toLocaleLowerCase("tr");
  const deger = etiket => { for (const pg of sayfalar){ const e = pg.find(t=>kucuk(t.s).startsWith(etiket)); if (!e) continue;
      const ici = e.s.split(":").slice(1).join(":").trim(); if (ici) return ici;
      const v = pg.filter(t=>Math.abs(t.y-e.y)<3 && t.x>e.x).sort((a,b)=>a.x-b.x)[0]; return v ? v.s : ""; } return ""; };
  const kalemler = [];
  for (const pg of sayfalar){
    const bas = pg.find(t=>/^miktar$/i.test(t.s)); if (!bas) continue;
    const capalar = [];
    pg.forEach(t=>{ const m = t.s.match(/^([\d.]+(?:,\d+)?)\s*(adet|ad\.?)$/i);
      if (m) capalar.push({ x:t.x, y:t.y, miktar:num(m[1]) });
      else if (/^(adet|ad\.?)$/i.test(t.s)) { const n = pg.filter(o=>Math.abs(o.y-t.y)<2.5 && o.x<t.x && /^[\d.]+(,\d+)?$/.test(o.s)).sort((a,b)=>b.x-a.x)[0]; if (n) capalar.push({ x:n.x, y:t.y, miktar:num(n.s) }); } });
    capalar.filter(c=>c.y < bas.y-3).forEach(c=>{
      const satir = pg.filter(t=>Math.abs(t.y-c.y)<2.5);
      const kdvT = satir.find(t=>/^%\s*\d/.test(t.s)), kdv = kdvT ? num(kdvT.s.replace("%","")) : 20;
      const tutarT = satir.filter(t=>PARA.test(t.s) && t.x>c.x).sort((a,b)=>b.x-a.x)[0]; if (!tutarT || !c.miktar) return;
      const adParca = pg.filter(t=>t.x < c.x-2 && t.y < bas.y-3 && !(/^\d+$/.test(t.s) && t.x < c.x*0.35))
        .filter(t=>{ const yakin = capalar.reduce((a,o)=>Math.abs(o.y-t.y)<Math.abs(a.y-t.y)?o:a); return yakin===c && Math.abs(c.y-t.y)<=12; })
        .sort((a,b)=>b.y-a.y || a.x-b.x).map(t=>t.s);
      const tamAd = adParca.join(" ").replace(/\s+/g," ").trim(), am = adModel(tamAd);
      kalemler.push({ model: am.model || tamAd.slice(0,30), aciklama: tamAd, marka: am.marka, kategori: listeKategori(tamAd), adet: Math.round(c.miktar),
        birim_fiyat_kdv_dahil: r2(num(tutarT.s.replace(/TL/i,"")) / c.miktar * (1+kdv/100)), seri_nolar: [] });
    });
  }
  if (!kalemler.length) return null;
  const tm = deger("fatura tarihi").match(/(\d{2})[-./](\d{2})[-./](\d{4})/);
  const toplamS = deger("vergiler dahil toplam") || deger("ödenecek tutar");
  const ust = sayfalar[0].slice().sort((a,b)=>b.y-a.y)[0];
  return { yerel:true, fatura_no: deger("fatura no"), tarih: tm ? `${tm[3]}-${tm[2]}-${tm[1]}` : "", tedarikci: ust ? ust.s : "", not:"", toplam: toplamS ? num(toplamS.replace(/TL/i,"")) : 0, kalemler };
}

/* ---------- Profilo kampanya dokümanı (.docx) ---------- */
const LDA = ["Buzdolabı","Çamaşır makinesi","Bulaşık makinesi","Kurutma makinesi","Derin dondurucu"];
const aktifKampanyalar = () => db.kampanyalar.filter(k=>k.aktif);
async function docxBloklar(f){
  await scriptYukle(JSZIP);
  const z = await JSZip.loadAsync(await f.arrayBuffer()), xml = await z.file("word/document.xml").async("string");
  const d = new DOMParser().parseFromString(xml, "application/xml"), W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const metin = el => [...el.getElementsByTagNameNS(W,"t")].map(t=>t.textContent).join("").replace(/\s+/g," ").trim();
  const bl = [];
  for (const c of d.getElementsByTagNameNS(W,"body")[0].children){
    if (c.localName==="p") { const t = metin(c); if (t) bl.push({ p:t }); }
    else if (c.localName==="tbl") bl.push({ t:[...c.children].filter(x=>x.localName==="tr").map(tr=>[...tr.children].filter(x=>x.localName==="tc").map(metin)) });
  }
  return bl;
}
function kampanyaKural(baslik, ad, aciklama){
  const b = (baslik+" "+ad).toLocaleLowerCase("tr"), t = (baslik+" "+ad+" "+aciklama).toLocaleLowerCase("tr");
  if (/kurutma/.test(t) && /çamaşır/.test(t)) return { gruplar:[{ ad:"Kurutma makinesi", kat:["Kurutma makinesi"], modeller:[], adet:1 }, { ad:"Çamaşır makinesi", kat:["Çamaşır makinesi"], modeller:[], adet:1 }], haricXL:false };
  if (/televizyon|\btv\b/.test(b)) return { gruplar:[{ ad:"Televizyon", kat:[], modeller:[], adet:1 }, { ad:"Hediye Türk kahve makinesi", kat:[], modeller:[], adet:1 }], haricXL:false };
  if (/ankastre|\bset\b/.test(b)) return { gruplar:[{ ad:"Fırın", kat:["Fırın"], modeller:[], adet:1 }, { ad:"Ocak / davlumbaz", kat:["Ocak","Davlumbaz"], modeller:[], adet:1, enFazla:2 }], haricXL:false };
  return { gruplar:[{ ad:"Beyaz eşya", kat:LDA, modeller:[], adet:2 }], haricXL:/\bxx?l\b/.test(t) };
}
const MODEL_KOD = /^[A-ZÇĞİÖŞÜ]{2,}[A-Z0-9]*\d[A-Z0-9]*$/;
function kampanyaCoz(bl){
  const ks = [], basMetin = []; let bid = -1, tablo = 0;
  const yeniBaslik = t => { bid++; basMetin[bid] = { baslik:t.replace(/^kampanya\s*\d*\s*:\s*/i,"").trim(), metin:[] }; };
  for (const b of bl){
    if (b.p) { if (/^kampanya\b[^:]*:/i.test(b.p)) yeniBaslik(b.p); else if (bid>=0) basMetin[bid].metin.push(b.p); continue; }
    tablo++;
    for (const r of b.t){
      const ilk = r.find(c=>c) || "";
      if (/^kampanya\b[^:]*:/i.test(ilk)) { yeniBaslik(ilk); continue; }
      const tutarlar = r.filter(c=>/₺/.test(c) && /\d/.test(c)).map(c=>num(c.replace(/₺|TL/g,""))); // tablo tutarları ₺ ile; "10.000 TL indirim" gibi açıklamalar sayılmaz
      if (tutarlar.length && ilk && !/kampanya adı/i.test(ilk) && !/₺/.test(ilk)) { ks.push({ ad:ilk.replace(/\s*\*$/,""), bid, tablo, indirim: tutarlar.length>1 ? tutarlar[0] : null, primHaric: tutarlar[tutarlar.length-1], modeller:[] }); continue; }
      if (r.some(c=>MODEL_KOD.test(c))) {
        const seg = []; let cur = []; r.forEach(c=>{ if (MODEL_KOD.test(c)) cur.push(c); else if (cur.length) { seg.push(cur); cur=[]; } }); if (cur.length) seg.push(cur);
        const buTablo = ks.filter(k=>k.tablo===tablo); if (!buTablo.length) continue;
        seg.forEach((sg,i)=>(buTablo[i] || buTablo[buTablo.length-1]).modeller.push(...sg));
      } else if (bid>=0 && ilk && !/kampanya adı|k\.d\.v/i.test(ilk)) basMetin[bid].metin.push(r.filter(Boolean).join(" "));
    }
  }
  return ks.map(k=>{ const bm = basMetin[k.bid] || { baslik:"", metin:[] }, aciklama = bm.metin.join(" ").slice(0,400), kural = kampanyaKural(bm.baslik, k.ad, aciklama);
    if (k.modeller.length) kural.gruplar[0].modeller = [...new Set(k.modeller)];
    return { id:uid(), ad:k.ad, baslik:bm.baslik, aciklama, indirim:k.indirim, primHaric:r2(k.primHaric), prim:r2(k.primHaric*1.2), aktif:true, ...kural }; });
}
async function kampanyaDosyaOku(f){

const xlMi = p => /\bXX?L\b/.test(db.katalog[normModel(p?.model)]?.grup || "");
function grupUyar(g, u){ const p = P(u.pid); if (!p) return false;
  if (g.modeller.length) return g.modeller.some(m=>normModel(m)===normModel(p.model));
  if (trk(p.marka||"Profilo")!=="profilo") return false; // Profilo kampanyası: kategoriyle eşleşmede yalnız Profilo ürünleri
  return g.kat.includes(p.kategori); }
function kampanyaUyar(k, us){
  if (k.haricXL && us.some(u=>xlMi(P(u.pid)))) return false;
  const kalan = [...us];
  for (const g of [...k.gruplar].sort((a,b)=>b.modeller.length-a.modeller.length)){

/* ---------- Banka komisyon oranları (BSH aylık Excel'i) ---------- */
const ELLE = "elle";
const bankaSecenekleri = () => [{ id:ELLE, ad:"Elle girilen oranlar", tur:"kart", oran:db.settings.taksit }, ...((db.bankalar && db.bankalar.secenekler) || [])];
const bankaBul = id => bankaSecenekleri().find(b=>b.id===id) || bankaSecenekleri()[0];

const bankaOps = sec => { const l = bankaSecenekleri(), g = (t,ad) => { const x = l.filter(b=>b.tur===t); return x.length ? `<optgroup label="${ad}">${x.map(b=>`<option value="${esc(b.id)}"${b.id===sec?" selected":""}>${esc(b.ad)}</option>`).join("")}</optgroup>` : ""; };
  return g("kart","Kredi kartı taksit") + g("kredi","Alışveriş kredisi (bayi komisyonlu)"); };
const taksitSayilari = B => Object.keys(B.oran).map(Number).filter(n=>n>1 && B.oran[n]!=null && B.oran[n]!=="").sort((a,b)=>a-b);
function bankaDosyaCoz(wb){
  const sec = [], slug = s => s.toLocaleLowerCase("tr").replace(/[^a-z0-9çğıöşü]+/g,"-").replace(/^-|-$/g,"");
  wb.SheetNames.forEach((sayfa, si)=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sayfa],{header:1,raw:true,defval:""}), parca = [];
    /* bölüm adı: "BLOKELİ / ERTESİ GÜN / Taksitli işlemler" sütun başlıklarının olduğu satırın ilk hücresi */
    const baslikBul = i => { for (let j=i-1; j>=0 && j>=i-6; j--){ const r = rows[j], t = String(r.find(c=>String(c).trim())||"").trim();
      if (r.some(c=>/^(blokeli|ertesi gün|taksitli işlemler?)$/.test(trk(c).trim())) || /kredi maliyet tablosu|bloke gün çalışan/.test(trk(t))) return t.replace(/\s+/g," "); } return ""; };
    rows.forEach((r,i)=>{
      /* yatay: başlık satırında "2 taksit, 3 taksit…", altında TOPLAM satırı */
      const kol = {}; r.forEach((c,j)=>{ const m = String(c).trim().match(/^(\d{1,2})\s*taksit$/i); if (m) kol[j] = +m[1]; });
      if (Object.keys(kol).length>=2) {
        const t = rows.slice(i+1, i+8).find(x=>/^(toplam|toplam kesinti)/i.test(String(x.find(c=>String(c).trim())||"").trim())); if (!t) return;
        const oran = {}; for (const j in kol) if (typeof t[j]==="number") oran[kol[j]] = t[j];
        if (Object.keys(oran).length) parca.push({ tur:"kart", baslik: baslikBul(i), oran, ertesi: /ERTESİ GÜN/i.test(rows.slice(Math.max(0,i-3),i).flat().join(" ")) });
      }
      /* dikey: "2 Taksit" satırları, "TOPLAM" sütunu */
      if (/^taksit sayısı$/.test(trk(r[0]).trim())) { const tj = r.findIndex(c=>/toplam/i.test(String(c))); if (tj<0) return; const oran = {};
        rows.slice(i+1).forEach(x=>{ const m = String(x[0]).trim().match(/^(\d{1,2})\s*taksit$/i); if (m && typeof x[tj]==="number") oran[+m[1]] = x[tj]; });
        if (Object.keys(oran).length) parca.push({ tur:"kart", baslik: baslikBul(i) || "Blokeli", oran, ertesi:false }); }
      /* alışveriş kredisi: "Vade (Ay)" + "Bayi Komisyon / Katkı Payı Oranı" */
      const iV = r.findIndex(c=>/^vade/i.test(String(c).trim())), iO = r.findIndex(c=>/bayi (komisyon|katkı payı) oranı/i.test(String(c)));
      if (iV>=0 && iO>=0) { const oran = {};
        for (const x of rows.slice(i+1)) { if (typeof x[iV]!=="number") break; if (typeof x[iO]==="number" && x[iO]>0 && x[iO]<1) oran[x[iV]] = x[iO]; }
        if (Object.keys(oran).length) parca.push({ tur:"kredi", baslik: baslikBul(i), oran, yuzde:false }); }
    });
    const yuzde = parca.some(p=>p.tur==="kart" && Object.values(p.oran).some(v=>v>1)); // sayfa yüzde mi kesir mi
    parca.forEach(p=>{
      const kesir = p.tur==="kredi" || !yuzde, oran = {}; for (const n in p.oran) oran[n] = r2(p.oran[n] * (kesir ? 100 : 1));
      let ad = (si===0 ? p.baslik : sayfa + (p.baslik ? " · " + p.baslik.replace(/^BSH BAYİLER\s*/i,"") : "")).replace(/\(\*?\s*/,"· ").replace(/\s*için geçerlidir\)?/i,"").replace(/\s+/g," ").trim();
      if (p.tur==="kart" && p.ertesi) ad += " (ertesi gün)";
      sec.push({ id: slug(ad), ad, tur:p.tur, oran });
    });
  });
  const tekil = {}; return sec.filter(b=>tekil[b.id] ? false : (tekil[b.id]=1));
}

  sheet(`<div class="row sp"><h2 style="margin:0">Banka oranlarını yükle</h2><button class="mini" id="kapat" style="flex:0 0 auto">Kapat</button></div>
    <div class="muted">${esc(f.name)}</div><label>Dönem</label><input id="bAd" value="${esc(ad)}">
    <div class="res"><b>${sec.filter(b=>b.tur==="kart").length} kart seçeneği, ${sec.filter(b=>b.tur==="kredi").length} kredi seçeneği</b> okundu. Oranlar toplam kesinti (komisyon + puan) yüzdesidir.</div>
    <div class="card"><table><tr><th>Seçenek</th><th style="text-align:right">3</th><th style="text-align:right">6</th><th style="text-align:right">9</th><th style="text-align:right">12</th></tr>${sec.map(b=>`<tr><td>${esc(b.ad)}</td>${[3,6,9,12].map(n=>`<td style="text-align:right">${b.oran[n]!=null?"%"+virgul(b.oran[n]):"—"}</td>`).join("")}</tr>`).join("")}</table></div>
    <button class="b" id="bKay">Kaydet</button>`);
  $("#kapat").onclick=sheetKapat;
  $("#bKay").onclick=()=>{ db.bankalar = { ad:$("#bAd").value.trim()||ad, yuklendi:today(), secenekler:sec }; save(); sheetKapat(); toast(`${sec.length} banka seçeneği yüklendi`); vDiger(); };
}

/* ---------- Profilo fiyat farkları (satışta kâra eklenir) ---------- */
function fiyatFarkiCoz(wb){
  const k = {}, aile = {}; let bas = "", bit = "", sutun = "";
  wb.SheetNames.forEach(ad=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[ad],{header:1,raw:true,defval:""}), hi = rows.findIndex(r=>r.some(c=>/fiyat fark/i.test(String(c)))); if (hi<0) return;
    const h = rows[hi].map(c=>String(c)), fc = h.map((x,i)=>/fiyat fark/i.test(x)?i:-1).filter(i=>i>=0), ci = fc[fc.length-1], c = /hariç/.test(trk(h[ci])) ? 1.2 : 1;
    const iU = h.findIndex(x=>/uygulama/i.test(x)), iE = h.findIndex(x=>/ek şart/i.test(x)), iB = h.findIndex(x=>/başlangıç/i.test(x)), iS = h.findIndex(x=>/son .*tarih/i.test(x)), aileMi = /aile/i.test(ad);
    rows.slice(hi+1).forEach(r=>{ const m = normModel(r[0]); if (!MODEL_KOD.test(m) || typeof r[ci]!=="number") return;
      if (aileMi) aile[m] = r2(r[ci]*c);
      else { k[m] = { tutar:r2(r[ci]*c), sart:String(r[iU]??"").trim(), ek:String(r[iE]??"").trim() }; if (!bas && iB>=0) bas = tarihOku(r[iB]); if (!bit && iS>=0) bit = tarihOku(r[iS]); } });
    if (!aileMi) sutun = h[ci];
  });
  return { k, aile, bas, bit, sutun };
}
async function fiyatFarkiOku(f){
  if (!window.XLSX) return alert("Excel modülü yüklenemedi. İnternete bağlıyken tekrar deneyin.");
  let r; try { r = fiyatFarkiCoz(XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true})); } catch(e){ return alert("Dosya okunamadı: "+e.message); }
  if (!Object.keys(r.k).length && !Object.keys(r.aile).length) return alert("Bu dosyada fiyat farkı tablosu bulunamadı.");
  const ay = (r.sutun.match(new RegExp(AYLAR.join("|"),"i"))||[""])[0], stok = db.units.filter(u=>!u.satis && r.k[normModel(P(u.pid)?.model)]);
  sheet(`<div class="row sp"><h2 style="margin:0">Fiyat farklarını yükle</h2><button class="mini" id="kapat" style="flex:0 0 auto">Kapat</button></div>
    <div class="muted">${esc(f.name)} · kullanılan sütun: ${esc(r.sutun)}</div>
    <label>Dönem adı</label><input id="ffAd" value="${esc((ay+" "+(r.bas||today()).slice(0,4)).trim())}">
    <div class="row"><div><label>Başlangıç</label><input id="ffBas" type="date" value="${r.bas}"></div><div><label>Son satış tarihi</label><input id="ffBit" type="date" value="${r.bit}"></div></div>
    <div class="res"><b>${Object.keys(r.k).length} modelde fiyat farkı</b> (“BİTTİ” yazanlar alınmadı), ${Object.keys(r.aile).length} modelde Aile Bakanlığı farkı.<br>
      <span class="muted">Tutarlar KDV dahile çevrildi (×1,2). Stoktaki ${stok.length} cihaz için toplam ${TL(stok.reduce((a,u)=>a+r.k[normModel(P(u.pid).model)].tutar,0))}.</span></div>
    <div class="muted">Şart: ${esc([...new Set(Object.values(r.k).map(x=>x.sart).filter(Boolean))].join(" / ")||"—")}${Object.values(r.k).some(x=>x.ek)?` · bazı modellerde: ${esc([...new Set(Object.values(r.k).map(x=>x.ek).filter(Boolean))].join(" / "))}`:""}</div>
    <button class="b" id="ffKay">Kaydet</button>`);
  $("#kapat").onclick=sheetKapat;
  $("#ffKay").onclick=()=>{ db.fiyatFarki = { ad:$("#ffAd").value.trim(), bas:$("#ffBas").value, bit:$("#ffBit").value, k:r.k, aile:r.aile, yuklendi:today() }; save(); sheetKapat(); toast("Fiyat farkları yüklendi"); vDiger(); };
}
const farkBilgi = (model, tarih=today()) => { const f = db.fiyatFarki, x = f && f.k[normModel(model)]; if (!x) return null; return { ...x, icinde: (!f.bas || tarih>=f.bas) && (!f.bit || tarih<=f.bit), donem:f.ad, bit:f.bit }; };
const aileFark = model => (db.fiyatFarki && db.fiyatFarki.aile[normModel(model)]) || 0;
const farkKutu = (p, u, kom) => { const f = farkBilgi(p.model); if (!f) return "";
  return `<div class="res" style="background:var(--okbg)"><div class="row sp"><span>Profilo fiyat farkı · ${esc(f.donem)}</span><b class="pos">+${TL(f.tutar)}</b></div>
    <div class="muted">${f.icinde?`${trDate(f.bit)} tarihine kadar satışta kâra eklenir.`:"Dönem dışında — eklenmez."}${f.ek?" "+esc(f.ek)+".":""}</div>
    ${f.icinde?`<div class="row sp"><span class="muted">Fiyat farkıyla zarar sınırı</span><b>${TL(fiyatIcin(maliyet(u)-f.tutar,0,kom))}</b></div>`:""}
    ${aileFark(p.model)?`<div class="muted">Aile Bakanlığı satışında ayrıca +${TL(aileFark(p.model))}</div>`:""}</div>`; };

/* ---------- Satış formu ---------- */
function satisFormu(uidSec, fiyat){
  const u = db.units.find(x=>x.id===uidSec), p = P(u.pid), s = db.settings;
  let bid = varsayilanBanka().id;
  sheet(`<h2>Satış · ${esc(pAd(p))}</h2><div class="muted">Seri: ${esc(u.seri||"—")}</div>${maliyetKutu(u)}
    <label>Satış fiyatı (KDV dahil)</label><input id="sTutar" inputmode="decimal" value="${virgul(fiyat)}">
    <div class="row"><div><label>Ödeme</label><select id="sOd">${odemeOps(durum.odeme)}</select></div><div style="flex:0 0 100px"><label>Komisyon %</label><input id="sKom" inputmode="decimal" value="${s.kom[durum.odeme]||0}"></div></div>
    <div id="sTk" class="hide"><div class="row"><div><label>Banka / kredi</label><select id="sBanka">${bankaOps(bid)}</select></div><div style="flex:0 0 110px"><label>Taksit</label><select id="sN"></select></div></div></div>
    <label>Ek gider (montaj, nakliye, takas indirimi) — ₺</label><input id="sGider" inputmode="decimal" placeholder="0">
    <div class="row"><div><label>Tarih</label><input id="sTarih" type="date" value="${today()}"></div><div><label>Müşteri (isteğe bağlı)</label><input id="sMus"></div></div>
    <div id="sFark"></div>
    <label>Not</label><input id="sNot">
    <div id="sOzet"></div>
    <button class="b" id="sKaydet">Satışı kaydet</button><button class="b2" id="kapat" style="width:100%;margin-top:8px">Vazgeç</button>`);
  const farkCiz = () => { const f = farkBilgi(p.model, $("#sTarih").value||today()), a = aileFark(p.model);
    $("#sFark").innerHTML = (f ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sFf" ${f.icinde?"checked":""} style="width:auto"> Profilo fiyat farkı +${TL(f.tutar)}</label><div class="muted">${f.icinde?"":"Satış tarihi dönem dışında. "}${esc(f.sart)}${f.ek?" · "+esc(f.ek):""}</div>` : "")
      + (a ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sAile" style="width:auto"> Aile Bakanlığı satışı +${TL(a)}</label>` : "");
    ["#sFf","#sAile"].forEach(i=>{ if ($(i)) $(i).onchange=ozet; }); };
  const tkCiz = () => { const B = bankaBul(bid), ns = taksitSayilari(B), sec = $("#sN").value;
    $("#sN").innerHTML = ns.map(n=>`<option value="${n}"${String(n)===sec?" selected":""}>${n} ${B.tur==="kredi"?"ay":"taksit"}</option>`).join("");
    const n = $("#sN").value; if (n) $("#sKom").value = virgul(B.oran[n]); };
  const oku = () => ({ tutar:$("#sTutar").value, odeme:$("#sOd").value, komOran:num($("#sKom").value), gider:$("#sGider").value, tarih:$("#sTarih").value||today(), musteri:$("#sMus").value.trim(), not:$("#sNot").value.trim(),
    fark: $("#sFf") && $("#sFf").checked ? farkBilgi(p.model).tutar : 0, aile: $("#sAile") && $("#sAile").checked ? aileFark(p.model) : 0 });
  const ozet = () => { const h = satisHesap(u, oku());
    $("#sOzet").innerHTML = `<div class="res ${h.kar<0?"neg":""}"><div class="row sp"><span>Satış</span><b>${TL(h.tutar)}</b></div><div class="row sp"><span>Maliyet</span><b>−${TL(h.maliyet)}</b></div><div class="row sp"><span>Komisyon</span><b>−${TL(h.kom)}</b></div><div class="row sp"><span>Ek gider</span><b>−${TL(h.gider)}</b></div>
      ${h.fark?`<div class="row sp"><span>Profilo fiyat farkı</span><b>+${TL(h.fark)}</b></div>`:""}${h.aile?`<div class="row sp"><span>Aile Bakanlığı farkı</span><b>+${TL(h.aile)}</b></div>`:""}
      <div class="row sp" style="margin-top:4px"><span class="big">Kâr</span><span class="big ${h.kar<0?"neg":"pos"}">${TL(h.kar)}</span></div>
      <div class="row sp"><span>Prim düşünce kâr</span><b class="${h.karPrimli<0?"neg":"pos"}">${TL(h.karPrimli)}</b></div>
      <div class="muted">Maliyete göre %${h.oran.toFixed(1)} · yıl sonu primi ${TL(h.prim)}</div></div>`; };
  $("#sOd").onchange=e=>{ const t = e.target.value==="taksit"; $("#sTk").classList.toggle("hide",!t); if (t) tkCiz(); else $("#sKom").value = s.kom[e.target.value]||0; ozet(); };
  $("#sBanka").onchange=e=>{ bid=e.target.value; tkCiz(); ozet(); }; $("#sN").onchange=()=>{ tkCiz(); ozet(); };
  $("#sTarih").onchange=()=>{ farkCiz(); ozet(); };
  ["#sTutar","#sKom","#sGider"].forEach(i=>$(i).oninput=ozet);
  if (durum.odeme==="taksit") { $("#sTk").classList.remove("hide"); tkCiz(); }
  farkCiz(); ozet();
  $("#kapat").onclick=sheetKapat;
  $("#sKaydet").onclick=()=>{
    const o = oku(); if (!num(o.tutar)) return alert("Satış fiyatını yazın.");
    const h = satisHesap(u,o), tk = o.odeme==="taksit" ? { banka:bankaBul(bid).ad, n:+$("#sN").value } : null;
    u.satis = { tarih:o.tarih, tutar:h.tutar, odeme:o.odeme, komOran:o.komOran, kom:h.kom, gider:h.gider, musteri:o.musteri, not:o.not, fark:h.fark, aile:h.aile, ...(tk?{ taksit:tk }:{}) };
    durum.odeme = o.odeme; save(); sheetKapat(); durum.pid = stoktaki(p.id).length ? p.id : null; toast("Satış kaydedildi · kâr "+TL(h.kar)); render();
  };
}

/* Alt pencere */
function sheet(html){ $("#sheet").innerHTML=`<div class="sheet"><div>${html}</div></div>`; document.body.style.overflow="hidden"; }
function sheetKapat(){ $("#sheet").innerHTML=""; document.body.style.overflow=""; }

/* Başlat */
load(); save(); go("fiyat");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
